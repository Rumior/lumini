<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finance OS · Lumini</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head><body>
<div class="app">

<main>
 <header class="top">
 <div class="crumb">Amani workspace &nbsp;›&nbsp; <b>Finance OS</b></div>
 <button class="srch btn" id="sr" aria-label="Search and jump to"><span data-i="search"></span><span class="t">Search or jump to…</span><kbd>Ctrl K</kbd></button>
 <button class="ib" id="th" aria-label="Toggle dark mode" data-i="moon"></button><button class="ib" aria-label="Notifications" data-d="bell" data-i="bell"></button><button class="av" aria-label="Account: RI" data-d="account">RI</button></header>
 <div class="wrap">
 <div class="ph"><div class="ti"><h1>Finance OS</h1><span class="sub">Business financial command centre · Amani Home &amp; Living</span></div>
  <div class="ctl"><span class="pill wn" title="Sample business, not connected to live accounts">◆ Demo data</span><span class="mu sm" id="fresh"></span>
   <label class="btn"><span class="lbl">Period</span><select id="per" aria-label="Reporting period"><option value="m">This month</option><option value="l">Last month</option><option value="q">This quarter</option><option value="y">This year</option><option value="c">Custom range…</option></select></label>
   <span class="btn" title="From organization settings"><span class="lbl">KES</span>KSh</span>
   <button class="btn" id="rf" data-i="refresh" aria-label="Refresh"></button><button class="btn" data-d="export" data-i="download" aria-label="Export report"></button>
   <label class="btn"><span class="lbl">State</span><select id="st" aria-label="Prototype state"><option value="n">Normal</option><option value="load">Loading</option><option value="part">Partial data</option><option value="stale">Stale data</option><option value="err">Error</option><option value="empty">No data</option></select></label></div></div>
 <div id="note"></div>
 <div id="dash">
  <div class="dock"><div class="qs" id="qa" role="toolbar" aria-label="Quick actions"></div><div class="dr" id="dr"></div></div>
  <section class="kpis" id="kpi" aria-label="Key financial indicators"></section>
  <section class="mid"><div class="card hero" id="hero" aria-label="Cash forecast"></div><div class="card fin" id="fin" aria-labelledby="fi"></div></section>
  <section class="tiles"><div class="card" id="loan"></div><div class="card" id="rp"></div><div class="card" id="bud"></div></section>

 </div>
 <div id="empty" class="card hide"><div class="lbl">Getting started</div><h2 style="font-size:28px">No financial data yet</h2><p class="sub" style="margin:6px 0 14px">Finance OS needs a starting point. Nothing here is zero; it is simply not set up.</p><div class="qs" id="onb"></div></div>
 </div></main></div>
<dialog id="dlg" aria-labelledby="dt"><div class="lbl" id="dk"></div><h2 id="dt" style="font-size:26px;margin-bottom:8px"></h2><div id="db"></div><form method="dialog" style="margin-top:16px;text-align:right"><button class="btn p">Close</button></form></dialog>
<dialog id="pal" aria-label="Search and jump to"><input id="pq" placeholder="Search actions and modules…" aria-label="Search actions and modules" autocomplete="off"><div id="pl"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script></body></html>
